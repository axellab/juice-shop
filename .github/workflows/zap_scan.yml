name: "OWASP ZAP Automated Security Scan"

on:
  schedule:
    # GitHub Actions cron uses UTC. 01:00 UTC runs daily at 22:00 GMT-3.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: owasp-zap-automated-security-scan
  cancel-in-progress: true

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Scan Juice Shop preview instance with OWASP ZAP Baseline
    steps:
      - name: Check out Git repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
        with:
          ref: develop
      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'https://preview.owasp-juice.shop'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
